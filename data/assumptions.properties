# OrbitSlot assumptions.
# EVERY made-up number in the project lives in this file and nowhere else.
# These values are NOT real operator data; they are placeholders chosen to
# create a realistic-looking scheduling problem. Cite this file in the report.

# --- Ground station -------------------------------------------------------
# Which row of data/stations.csv to use.
station.id=1492
# Number of antennas (each tracks one satellite at a time).
station.antennas=2
# Passes are only usable above this elevation (degrees).
station.minElevationDeg=10
# Antenna rotator speed, used by the slew-time constraint (degrees/second).
# Only azimuth is modelled; the rotator turns the shorter way round.
station.slewSpeedDegPerSec=3
# Fixed time between two passes on one antenna for radio reconfiguration (s).
station.setupSeconds=60

# --- Metrics --------------------------------------------------------------
# Satellites with priority >= this count as "high priority".
metrics.highPriorityMin=8

# --- Planning window ------------------------------------------------------
# Fixed start (UTC, ISO-8601) so every run is reproducible. Keep it within a
# few days of the snapshot epochs in data/celestrak/ for accurate predictions.
schedule.start=2026-11-18T00:00:00Z
schedule.horizonHours=24
# Satellites with an orbital period at or above this are excluded (not LEO).
# LEO is usually defined as altitude <= 2000 km, i.e. period below ~128 min.
# (Not to be confused with SGP4's 225 min near-Earth/deep-space boundary.)
schedule.leoMaxPeriodMinutes=128

# --- Output ---------------------------------------------------------------
display.timezone=UTC

# --- Reproducibility ------------------------------------------------------
# Seed for everything random (per-satellite priorities, simulated passes).
random.seed=42

# --- Satellite types --------------------------------------------------------
# downlinkKbps : downlink rate in kilobits per second
# bufferMB     : onboard storage in megabytes (10^6 bytes)
# priorityMin/Max : each satellite of the type gets its own priority in this
#                   range (1 = lowest, 10 = highest), drawn from the seed and
#                   its NORAD id. data/priorities.csv can pin exact values.
weather.downlinkKbps=4000
weather.bufferMB=2000
weather.priorityMin=7
weather.priorityMax=10

comms.downlinkKbps=1000
comms.bufferMB=500
comms.priorityMin=4
comms.priorityMax=7

cubesat.downlinkKbps=9.6
cubesat.bufferMB=5
cubesat.priorityMin=1
cubesat.priorityMax=5

# --- Data volume ----------------------------------------------------------
# Data volume per pass = downlink rate x pass duration (an assumption: it
# ignores elevation-dependent link quality and protocol overhead).

# --- Simulated passes (Stage 1, used until real prediction is wired in) ---
sim.passesPerSatellitePerDay=4
sim.minDurationMinutes=5
sim.maxDurationMinutes=15
sim.maxElevationMinDeg=10
sim.maxElevationMaxDeg=90
